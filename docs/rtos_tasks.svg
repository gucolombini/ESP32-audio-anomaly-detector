<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
 <rect width="1040" height="500" fill="#f8fafc"/><text x="520" y="35" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Arquitetura FreeRTOS — detector de tosse</text>
 <g font-family="sans-serif"><rect x="35" y="90" width="180" height="90" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="125" y="120" text-anchor="middle" font-weight="bold">INMP441 + I2S DMA</text><text x="125" y="148" text-anchor="middle">16 kHz / 32-bit → PCM16</text>
 <rect x="285" y="80" width="210" height="110" rx="12" fill="#fee2e2" stroke="#dc2626"/><text x="390" y="110" text-anchor="middle" font-weight="bold">Task 1: captura</text><text x="390" y="135" text-anchor="middle">prioridade alta · core 0</text><text x="390" y="160" text-anchor="middle">janela de 1 segundo</text>
 <rect x="565" y="80" width="210" height="110" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="670" y="110" text-anchor="middle" font-weight="bold">Task 2: MFCC</text><text x="670" y="135" text-anchor="middle">prioridade média · core 1</text><text x="670" y="160" text-anchor="middle">49 × 13 features</text>
 <rect x="825" y="80" width="180" height="110" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="915" y="110" text-anchor="middle" font-weight="bold">Task 3: detecção</text><text x="915" y="135" text-anchor="middle">prioridade baixa · core 1</text><text x="915" y="160" text-anchor="middle">TFLM int8</text>
 <rect x="295" y="285" width="190" height="85" rx="10" fill="#e0e7ff" stroke="#4f46e5"/><text x="390" y="315" text-anchor="middle" font-weight="bold">Pool: 2 buffers</text><text x="390" y="340" text-anchor="middle">free_audio_q</text><text x="390" y="360" text-anchor="middle">ready_audio_q</text>
 <rect x="575" y="285" width="190" height="85" rx="10" fill="#e0e7ff" stroke="#4f46e5"/><text x="670" y="315" text-anchor="middle" font-weight="bold">feature_q (1)</text><text x="670" y="342" text-anchor="middle">overwrite: dado recente</text>
 <rect x="835" y="285" width="160" height="85" rx="10" fill="#fce7f3" stroke="#db2777"/><text x="915" y="315" text-anchor="middle" font-weight="bold">LED GPIO 2</text><text x="915" y="342" text-anchor="middle">p(tosse) ≥ 0,50</text>
 <g stroke="#334155" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M215 135 H280"/><path d="M495 135 H560"/><path d="M775 135 H820"/><path d="M390 190 V280"/><path d="M670 190 V280"/><path d="M915 190 V280"/></g>
 <text x="520" y="440" text-anchor="middle" font-size="15">Filas transferem propriedade exclusiva dos buffers; nenhuma leitura e escrita concorrente no mesmo bloco.</text></g>
</svg>
